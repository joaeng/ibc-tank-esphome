type: custom:button-card
entity: sensor.ibc_tank_1_niva
name: IBC-tank
show_icon: false
show_state: true
show_label: true
state_display: >-
  [[[ return Math.round(Number(entity.state) || 0) + " %"; ]]]
label: >-
  [[[
    const volume = states["sensor.ibc_tank_1_volym"];
    return volume
      ? Math.round(Number(volume.state) || 0) + " liter kvar"
      : "Volym saknas";
  ]]]
custom_fields:
  tank: >-
    [[[
      const level = Math.max(0, Math.min(100, Number(entity.state) || 0));
      return `<div style="position:relative;width:100%;aspect-ratio:1/1;">
        <div style="position:absolute;left:13%;right:13%;bottom:16%;height:70%;overflow:hidden;border-radius:7%;">
          <div style="position:absolute;left:0;right:0;bottom:0;height:` + level + `%;background:linear-gradient(180deg,rgba(79,195,247,.78),rgba(2,119,189,.9));transition:height 1.2s ease;"></div>
        </div>
        <img src="/local/images/ibc-tank-overlay.png" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:2;">
      </div>`;
    ]]]
styles:
  grid:
    - grid-template-areas: >-
        "tank" "n" "s" "l"
    - grid-template-columns: 1fr
    - grid-template-rows: auto min-content min-content min-content
  card:
    - padding: 14px
  custom_fields:
    tank:
      - width: 100%
  name:
    - font-weight: 600
    - padding-top: 4px
  state:
    - font-size: 26px
    - font-weight: 700
  label:
    - color: var(--secondary-text-color)
    - padding-bottom: 4px
